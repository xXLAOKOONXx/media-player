<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  
  <!-- Letter M integrated with music note -->
  <g fill="#ecf0f1">
    <!-- Left stem of M that becomes music note stem -->
    <path d="M 18 22 L 18 44 L 22 44 L 22 28 L 28 36 L 34 28 L 34 44 L 38 44 L 38 22 L 34 22 L 28 32 L 22 22 Z"/>
    
    <!-- Music note head at bottom of left stem -->
    <ellipse cx="20" cy="45" rx="3.5" ry="2.5" transform="rotate(-20 20 45)"/>
    
    <!-- Music note head at bottom of right stem -->
    <ellipse cx="36" cy="45" rx="3.5" ry="2.5" transform="rotate(-20 36 45)"/>
    
    <!-- Music note beam connecting the tops -->
    <path d="M 18 22 L 38 20 L 38 23 L 18 25 Z" fill="#3498db"/>
    
    <!-- Small accent dots to emphasize musical theme -->
    <circle cx="46" cy="24" r="2" fill="#3498db"/>
    <circle cx="48" cy="32" r="1.5" fill="#3498db"/>
  </g>
</svg>
