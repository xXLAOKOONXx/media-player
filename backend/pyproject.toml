[project]
name = "media-player-backend"
version = "0.1.0"
description = "Media Player Backend for Raspberry Pi"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "pygame==2.6.1",
    "mutagen==1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
