[project]
name = "media-player-backend"
version = "0.1.0"
description = "Media Player Backend for Raspberry Pi"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask==3.0.0",
    "flask-socketio==5.3.6",
    "python-socketio==5.11.0",
    "pygame==2.6.1",
    "mutagen==1.47.0",
    "python-mpv==1.0.7",
    "bcrypt==4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.1.0",
    "requests>=2.31.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]
screenshots = [
    "playwright>=1.40.0",
    "requests>=2.31.0",
]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
