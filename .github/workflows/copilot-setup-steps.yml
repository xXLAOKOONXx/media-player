name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation,
# and allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Required to clone the repository as part of setup steps
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install system dependencies (mpv and ffmpeg) required for video processing
      - name: Install mpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv ffmpeg

      # Set up Python 3.13 as required by the project
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Install and configure uv for Python dependency management
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: backend
          python-version: '3.13'

      # Sync Python dependencies from backend/pyproject.toml
      - name: Install Python dependencies with uv
        working-directory: backend
        run: |
          uv sync --frozen --extra dev --extra screenshots

      # Install Playwright browsers for screenshot generation
      - name: Install Playwright browsers
        working-directory: backend
        run: |
          uv run playwright install chromium --with-deps

      # Set up Node.js for frontend dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci
