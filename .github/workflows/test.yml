name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: backend
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
      
      - name: Run unit tests
        working-directory: backend
        run: |
          uv run pytest tests/ -v --tb=short --junit-xml=test-results.xml
        continue-on-error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: backend/test-results.xml
          retention-days: 30
      
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results - ${{ matrix.os }} (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/test-results.xml ]; then
            echo "✓ Tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ Test results not found" >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash

  test-coverage:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: backend
          python-version: '3.13'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
      
      - name: Run tests with coverage
        working-directory: backend
        run: |
          uv run pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-report=term
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 30
      
      - name: Coverage Summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/coverage.xml ]; then
            echo "✓ Coverage report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
