name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the build (optional)'
        required: false
        type: string
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0.0
        shell: bash
      
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      
      - name: Verify frontend build
        run: |
          if (Test-Path backend/static/index.html) {
            Write-Host "✓ Frontend built successfully"
          } else {
            Write-Error "Frontend build failed - static files not found"
            exit 1
          }
        shell: pwsh
      
      - name: Build Windows executable with PyInstaller
        run: python -m PyInstaller media-player.spec
        working-directory: backend
      
      - name: Verify executable creation
        run: |
          if (Test-Path backend/dist/media-player/media-player.exe) {
            Write-Host "✓ Executable created successfully"
            Get-ChildItem backend/dist/media-player | Format-Table Name, Length, LastWriteTime
          } else {
            Write-Error "Executable not found"
            exit 1
          }
        shell: pwsh
      
      - name: Create artifact name
        id: artifact-name
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $artifactName = "media-player-windows-${{ inputs.version }}"
          } else {
            $date = Get-Date -Format "yyyy-MM-dd"
            $sha = "${{ github.sha }}".Substring(0, 7)
            $artifactName = "media-player-windows-${date}-${sha}"
          }
          echo "name=$artifactName" >> $env:GITHUB_OUTPUT
          Write-Host "Artifact name: $artifactName"
        shell: pwsh
      
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: backend/dist/media-player/
          retention-days: 30
          if-no-files-found: error
      
      - name: Create release notes
        run: |
          $releaseNotes = @"
          # Media Player Windows Build
          
          ## Build Information
          - Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          $(if ("${{ inputs.version }}" -ne "") { "- Version: ${{ inputs.version }}" } else { "" })
          
          ## Contents
          This artifact contains the complete Windows executable bundle including:
          - media-player.exe (standalone executable)
          - Built frontend (included in the executable)
          - All required dependencies
          
          ## Usage
          1. Download and extract the artifact
          2. Run media-player.exe
          3. Open your browser to http://localhost:5000
          
          ## Requirements
          - Windows 10 or later
          - No additional software required (Python and dependencies are bundled)
          
          For more information, see the documentation at:
          https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/BUNDLING.md
          "@
          
          $releaseNotes | Out-File -FilePath release-notes.txt -Encoding utf8
          Get-Content release-notes.txt
        shell: pwsh
      
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}-release-notes
          path: release-notes.txt
          retention-days: 30
